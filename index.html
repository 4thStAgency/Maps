<head>

    <title>Service Area Map</title>

    <meta name="viewport" content="initial-scale=1,width=device-width,viewport-fit=cover" />

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptiler/geocoding-control@2.1.6/style.css" />
    
    <!-- Import Turf.js -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <style>

        /* Page setup */

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            --font: 'Lexend', sans-serif;
            font-family: var(--font);
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }

        /* Pointer event management */

        #map {
            pointer-events: none;
        }

        .speech-bubble {
            pointer-events: auto;
        }



        /* Map attribution */

        .maplibregl-ctrl-attrib.maplibregl-compact {
            margin: 32px;
        }

        /* Geocoding control */

        .maplibregl-ctrl-top-left .maplibregl-ctrl {
            margin: 32px;
        }

        .maplibregl-ctrl-geocoder form {
            font-family: var(--font) !important;
            border-radius: 12px !important;
            width: 300px !important;
            min-width: 300px !important;
            max-width: 300px !important;
        }

        .maplibregl-ctrl-geocoder form div {
            padding: 8px;
            border-radius: 16px !important;
        }

        .maplibregl-ctrl-geocoder form div input{
            font-size: 14px !important;
            text-overflow: ellipsis;
        }

        
        @media screen and (max-width: 480px) {
            /* 16px on mobile to prevent auto zooming */
            .maplibregl-ctrl-geocoder form div input{
                font-size: 16px !important;
            }


            
            /* Geocoder positioning for mobile */

            .maplibregl-ctrl-attrib.maplibregl-compact {
                margin: 24px;
            }

            .maplibregl-ctrl-top-left .maplibregl-ctrl {
                margin: 24px;
            }

            .maplibregl-ctrl-geocoder form {
                font-family: var(--font) !important;
                border-radius: 12px !important;
                width: calc(100vw - 48px) !important;
                min-width: calc(100vw - 48px) !important;
                max-width: calc(100vw - 48px) !important;
            }
        }

        .maplibregl-ctrl-geocoder form div div.clear-button-container, .maplibregl-ctrl-geocoder form div div.clear-button-container button{
            cursor: pointer !important;
        }

        .maplibregl-ctrl-geocoder form div button.search-button {
            padding-left: 4px;
        }

        .maplibregl-ctrl-geocoder form ul {
            border-radius: 16px !important;
        }

        .maplibregl-ctrl-geocoder form ul li {
            cursor: pointer !important;
            animation: none !important;
            padding-left: 12px !important;
            padding-right: 12px !important;
        }

        .maplibregl-ctrl-geocoder form ul li img{
            display: none !important;
        }

        .maplibregl-ctrl-geocoder form div.no-results {
            display: none !important;
        }



        /* Speech bubble */

        .speech-bubble {
            position: relative;
            background: #FFFFFF;
            color: #000000;
            width: 300px;
            padding: 16px;
            border-radius: 16px;
            margin: 50px;
            font-family: var(--font) !important;
            font-size: 14px;
            transform: translateY(-50%);
            transform-origin: (bottom, center);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 2px 5px #33335926;
            animation: fadeIn .3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            0%   { opacity: 0.6; transform: scale(.5) translateY(-48%);}
            100% { opacity: 1; transform: scale(1) translateY(-50%);}
        }
          
        .speech-bubble::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%); 
            border: 10px solid transparent;
            border-top-color: #FFFFFF;
        }

        .speech-bubble-icon {
            height: 64px;
            width: 64px;
            margin-bottom: 12px;
        }

        .speech-bubble-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .speech-bubble-message {
            color: #79797f;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .speech-bubble-cta {
            font-family: var(--font) !important;
            background: rgb(37, 37, 37);
            color: #FFFFFF;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 24px;
            margin-top: 6px;
            margin-bottom: 6px;
            border: 3px solid rgb(37, 37, 37);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 6px 0px #33335900;
            transition: box-shadow .1s ease-in-out;
        }

        .speech-bubble-cta:hover {
            border: 3px solid rgb(255, 255, 255);
            box-shadow: 0 0 6px 0px #33335955;
        }

        .speech-bubble-cta:active {
            transform: scale(.98);
        }

    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // MARK: - Configurable constants

        // MapTiler public API key
        const API_KEY = 'TNtWDlBtkWMHsFhPqwDR';

        // Map style
        const style = 'https://api.maptiler.com/maps/streets-v2/style.json';

        // The target URL for the "Get Service Now" button
        const getServiceTarget = 'https://samedaygaragedoorservices.com/contact/get-service';


        // MARK: - Global constants

        // Service area data path (without extension - will try .geojson then .csv)
        const serviceAreaPath = 'assets/map';

        // Color palette for UI elements
        const color = {
            red: '#ff3b30',
            orange: '#ff9500',
            yellow: '#ffcc00',
            green: '#34c759',
            blue: '#208cf5'
        };

        // Map center (center of the USA for initial load)
        const center = [-98.5, 39.5];


        // Map initializer
        const map = new maplibregl.Map({
            container: 'map',
            style: style + '?key=' + API_KEY,
            center: center,
            zoom: 4,
            interactive: false,
        });


        // Collapse the attribution control on load
        document.querySelector('.maplibregl-ctrl-attrib').classList.remove('maplibregl-compact-show');


        map.on('style.load', async function() {
            
            // Helper function to parse WKT POLYGON to GeoJSON coordinates
            function parseWKTPolygon(wkt) {
                const match = wkt.match(/POLYGON\s*\(\(([^)]+)\)\)/i);
                if (!match) return null;
                const coordsString = match[1];
                const coordinates = coordsString.split(',').map(pair => {
                    const [lng, lat] = pair.trim().split(/\s+/).map(Number);
                    return [lng, lat];
                });
                return coordinates;
            }

            // Helper function to parse WKT LINESTRING to coordinate array
            function parseWKTLineString(wkt) {
                const match = wkt.match(/LINESTRING\s*\(([^)]+)\)/i);
                if (!match) return null;
                const coordsString = match[1];
                const coordinates = coordsString.split(',').map(pair => {
                    const [lng, lat] = pair.trim().split(/\s+/).map(Number);
                    return [lng, lat];
                });
                return coordinates;
            }

            // Helper function to parse CSV line and extract WKT and name
            function parseCSVLine(line) {
                const wktMatch = line.match(/"((?:POLYGON|LINESTRING)\s*\([^"]+\))"/i);
                if (!wktMatch) return null;
                
                // Extract the name (second column after the WKT)
                const afterWkt = line.substring(line.indexOf(wktMatch[0]) + wktMatch[0].length);
                const nameMatch = afterWkt.match(/,([^,]*),/);
                const name = nameMatch ? nameMatch[1].trim() : '';
                
                return { wkt: wktMatch[1], name };
            }

            // Helper function to check if two coordinates are equal (exact match)
            function coordsEqual(a, b) {
                return a[0] === b[0] && a[1] === b[1];
            }

            // Helper function to check if two coordinates are close (within tolerance)
            function coordsClose(a, b, tolerance = 0.001) {
                return Math.abs(a[0] - b[0]) < tolerance && Math.abs(a[1] - b[1]) < tolerance;
            }

            // Helper function to chain LineStrings by matching endpoints
            function chainLineStrings(lineStrings) {
                if (lineStrings.length === 0) return [];
                if (lineStrings.length === 1) return lineStrings[0];

                // Start with the first LineString
                const result = [...lineStrings[0]];
                const used = new Set([0]);

                // Keep finding the next connecting LineString
                while (used.size < lineStrings.length) {
                    const currentEnd = result[result.length - 1];
                    let foundNext = false;

                    for (let i = 0; i < lineStrings.length; i++) {
                        if (used.has(i)) continue;

                        const line = lineStrings[i];
                        const lineStart = line[0];
                        const lineEnd = line[line.length - 1];

                        // Check if this line's start connects to our current end
                        if (coordsEqual(lineStart, currentEnd) || coordsClose(lineStart, currentEnd)) {
                            // Add this line (skip first point if it matches)
                            const startIdx = coordsClose(lineStart, currentEnd) ? 1 : 0;
                            for (let j = startIdx; j < line.length; j++) {
                                result.push(line[j]);
                            }
                            used.add(i);
                            foundNext = true;
                            break;
                        }

                        // Check if this line's end connects to our current end (reversed)
                        if (coordsEqual(lineEnd, currentEnd) || coordsClose(lineEnd, currentEnd)) {
                            // Add this line in reverse (skip last point which matches)
                            for (let j = line.length - 2; j >= 0; j--) {
                                result.push(line[j]);
                            }
                            used.add(i);
                            foundNext = true;
                            break;
                        }
                    }

                    // If no connecting line found, find the closest one and add a gap segment
                    if (!foundNext) {
                        let closestIdx = -1;
                        let closestDist = Infinity;
                        let useReverse = false;

                        for (let i = 0; i < lineStrings.length; i++) {
                            if (used.has(i)) continue;

                            const line = lineStrings[i];
                            const lineStart = line[0];
                            const lineEnd = line[line.length - 1];

                            const distToStart = Math.hypot(lineStart[0] - currentEnd[0], lineStart[1] - currentEnd[1]);
                            const distToEnd = Math.hypot(lineEnd[0] - currentEnd[0], lineEnd[1] - currentEnd[1]);

                            if (distToStart < closestDist) {
                                closestDist = distToStart;
                                closestIdx = i;
                                useReverse = false;
                            }
                            if (distToEnd < closestDist) {
                                closestDist = distToEnd;
                                closestIdx = i;
                                useReverse = true;
                            }
                        }

                        if (closestIdx >= 0) {
                            const line = lineStrings[closestIdx];
                            if (useReverse) {
                                // Add in reverse
                                for (let j = line.length - 1; j >= 0; j--) {
                                    result.push(line[j]);
                                }
                            } else {
                                // Add normally
                                for (let j = 0; j < line.length; j++) {
                                    result.push(line[j]);
                                }
                            }
                            used.add(closestIdx);
                        } else {
                            break; // No more lines to add
                        }
                    }
                }

                return result;
            }

            // Helper function to parse Google MyMaps CSV export to GeoJSON
            function parseCSVToGeoJSON(csvText) {
                const lines = csvText.trim().split('\n');
                if (lines.length < 2) return null;
                
                // First, try to find a polygon
                for (let i = 1; i < lines.length; i++) {
                    const parsed = parseCSVLine(lines[i]);
                    if (parsed && parsed.wkt.toUpperCase().startsWith('POLYGON')) {
                        const coordinates = parseWKTPolygon(parsed.wkt);
                        if (coordinates) {
                            return {
                                type: 'Feature',
                                properties: {},
                                geometry: {
                                    type: 'Polygon',
                                    coordinates: [coordinates]
                                }
                            };
                        }
                    }
                }

                // Fallback: find LineStrings and combine them into a polygon
                let firstLineStringName = null;
                const lineStrings = [];

                for (let i = 1; i < lines.length; i++) {
                    const parsed = parseCSVLine(lines[i]);
                    if (parsed && parsed.wkt.toUpperCase().startsWith('LINESTRING')) {
                        // Use the first LineString's name as reference
                        if (firstLineStringName === null) {
                            firstLineStringName = parsed.name;
                        }
                        // Collect LineStrings with matching names (trimmed comparison)
                        if (parsed.name === firstLineStringName) {
                            const coords = parseWKTLineString(parsed.wkt);
                            if (coords && coords.length > 0) {
                                lineStrings.push(coords);
                            }
                        }
                    }
                }

                if (lineStrings.length === 0) return null;

                // Chain the LineStrings by matching endpoints (handles out-of-order lines)
                const combinedCoords = chainLineStrings(lineStrings);

                // Close the polygon if needed (connect last point to first point)
                if (combinedCoords.length > 0) {
                    const firstPoint = combinedCoords[0];
                    const lastPoint = combinedCoords[combinedCoords.length - 1];
                    if (!coordsEqual(firstPoint, lastPoint) && !coordsClose(firstPoint, lastPoint)) {
                        combinedCoords.push([...firstPoint]);
                    }
                }

                return {
                    type: 'Feature',
                    properties: {},
                    geometry: {
                        type: 'Polygon',
                        coordinates: [combinedCoords]
                    }
                };
            }

            // Fetch the service area data (GeoJSON with CSV fallback)
            let serviceArea;
            try {
                const response = await fetch(serviceAreaPath + '.geojson');
                if (!response.ok) throw new Error('GeoJSON fetch failed');
                const geojsonData = await response.json();
                // Extract the first feature from the FeatureCollection
                serviceArea = geojsonData.type === 'FeatureCollection' 
                    ? geojsonData.features[0] 
                    : geojsonData;
            } catch (e) {
                // Fallback to CSV
                console.log('GeoJSON fetch failed, trying CSV fallback...');
                try {
                    const csvResponse = await fetch(serviceAreaPath + '.csv');
                    if (!csvResponse.ok) throw new Error('CSV fetch failed');
                    const csvText = await csvResponse.text();
                    serviceArea = parseCSVToGeoJSON(csvText);
                    if (!serviceArea) {
                        throw new Error('Failed to parse CSV');
                    }
                } catch (csvError) {
                    console.error('Failed to load service area from both GeoJSON and CSV:', csvError);
                    return;
                }
            }

            map.addSource('serviceArea', {
                'type': 'geojson',
                'data': serviceArea
            });

            // Fit the map to the service area bounds (zoomed out initially)
            const bounds = new maplibregl.LngLatBounds();
            serviceArea.geometry.coordinates[0].forEach(function (coordinate) {
                bounds.extend(coordinate);
            });
            map.fitBounds(bounds, {
                padding: 240,
                animate: false
            });


            // Service area fill layer
            map.addLayer({
                'id': 'serviceAreaFill',
                'type': 'fill',
                'source': 'serviceArea',
                'layout': {},
                'paint': {
                    'fill-color': color.blue,
                    'fill-opacity': 0.2
                }
            }, "Road labels"); // Render underneath map labels


            // Service area outline layer
            map.addLayer({
                'id': 'serviceAreaOutline',
                'type': 'line',
                'source': 'serviceArea',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': color.blue,
                    'line-width': 3,
                    'line-dasharray': [1, 2]
                }
            }, "Road labels"); // Render underneath map labels


            // Calculate the center of the service area for geocoder proximity
            const serviceAreaCenter = turf.center(serviceArea).geometry.coordinates;
            const proximity = [
                Math.round(serviceAreaCenter[0] * 1000000) / 1000000,
                Math.round(serviceAreaCenter[1] * 1000000) / 1000000
            ];

            //Geocoder initializer
            const gc = new maplibreglMaptilerGeocoder.GeocodingControl({
                apiKey: API_KEY,
                maplibregl,
                country: 'us',
                noResultsMessage: 'No results found.',
                placeholder: `See if you're in our service area`,
                types: ['address'],
                proximity: proximity,
                zoom: 9.5,
                showPlaceType: 'false',
                showFullGeometry: false

            });
            map.addControl(gc, 'top-left');


            // Geocoder reset button event listener (clear the map markers and reset the view)
            const clearButton = document.querySelector('.clear-button-container button');
            clearButton.addEventListener('click', function() {
                const marker = document.querySelector('.maplibregl-marker');
                if (marker) {
                    marker.remove();
                }
                resetView();
            });


            // Geocoder pick event listener (custom flyTo and popup)
            gc.on('pick', function (e) {
                try {
                    // Initialize variables
                    const coords = e.feature.geometry.coordinates;
                    const polygon = map.getSource('serviceArea')._data.geometry.coordinates[0];
                    const point = turf.point(coords);
                    const polygonFeature = turf.polygon([polygon]);
                    const isInside = turf.booleanPointInPolygon(point, polygonFeature);
                    const addressRaw = e.feature.place_name;
                    const addressTrimmed = addressRaw.replace(', United States', '');
                    const addressLine1 = addressTrimmed.split(',')[0];
                    const addressLine2 = addressTrimmed.split(',').slice(1).join(',');

                    // Manually recenter after geocoding picks a location (to account for popup size)
                    map.flyTo({
                        center: coords,
                        zoom: 9.5,
                        offset: [0, 120] 
                    });
            
                    if (isInside) {
                        // Within service area
                        const marker = document.querySelector('.maplibregl-marker');
                        if (!marker) return;
                        const pin = marker.querySelector('svg');
                        if (pin) pin.remove();
            
                        const message = document.createElement('div');
                        message.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color.green}" class="speech-bubble-icon">
                                <path d="M0 0h24v24H0z" fill="none"/>
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 
                                        10 10 10 10-4.48 10-10S17.52 2 
                                        12 2zm-2 15-5-5 
                                        1.41-1.41L10 14.17l7.59-7.59L19 
                                        8l-9 9z"/>
                            </svg>
                            <span class="speech-bubble-title">You're in our service area</span>
                            <span class="speech-bubble-message">${addressLine1}<br>${addressLine2}</span>
                            <button class="speech-bubble-cta">Get Service Now</button>
                        `;
                        message.classList.add('speech-bubble');
                        marker.appendChild(message);
            
                        const button = document.querySelector('.speech-bubble-cta');
                        button.addEventListener('click', function() {
                            window.top.location.href = getServiceTarget;
                        });
            
                    } else {
                        // Outside service area
                        const marker = document.querySelector('.maplibregl-marker');
                        if (!marker) return;
                        const pin = marker.querySelector('svg');
                        if (pin) pin.remove();
            
                        const message = document.createElement('div');
                        message.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" 
                                 fill="${color.yellow}" class="speech-bubble-icon">
                                <path d="M0 0h24v24H0z" fill="none"/>
                                <path d="M12 2C6.48 2 2 6.48 
                                         2 12s4.48 10 10 10 10-4.48 
                                         10-10S17.52 2 12 2zm1 
                                         15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                            <span class="speech-bubble-title">
                                You're outside our standard service area
                            </span>
                            <span class="speech-bubble-message">
                                But we may still be able to help. 
                                Please reach out below to inquire.
                            </span>
                            <button class="speech-bubble-cta">Contact Us</button>
                        `;
                        message.classList.add('speech-bubble');
                        marker.appendChild(message);

                        const button = document.querySelector('.speech-bubble-cta');
                        button.addEventListener('click', function() {
                            window.top.location.href = getServiceTarget;
                        });
                    }
            
                } catch (e) {
                    console.log('Error:', e);
                }
            });


            // Remove extraneous suggestions from the geocoder and clean up the address
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    const suggestions = document.querySelectorAll('.maplibregl-ctrl-geocoder form ul li');
                    suggestions.forEach(function(suggestion) {
                        if (suggestion.innerHTML.includes('street.svg')) {
                            suggestion.remove();
                        }
                        const suggestionLine2s = suggestion.querySelectorAll('span span.line2');
                        suggestionLine2s.forEach(function(suggestionLine2) {
                            if (suggestionLine2.innerHTML.includes('United States')) {
                                suggestionLine2.innerHTML = suggestionLine2.innerHTML.replace(', United States', '');
                            }
                        });

                    });

                });
            });
            observer.observe(document, {
                childList: true,
                subtree: true
            });


            // Helper function to reset the map view to the service area
            function resetView() {
                const bounds = new maplibregl.LngLatBounds();
                const coordinates = map.getSource('serviceArea')._data.geometry.coordinates[0];
                coordinates.forEach(function (coordinate) {
                    bounds.extend(coordinate);
                });
                map.fitBounds(bounds, {
                    padding: 80
                });
            }

            // Ease in to the final view once the map has fully loaded
            map.on('load', function() {
                resetView();
            });


        });
        

    </script>
